name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/xxgraguxx/cal-diy:latest
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.difesamaltrattamenti.it
            NEXT_PUBLIC_API_V2_URL=https://agenda.difesamaltrattamenti.it/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            NEXTAUTH_SECRET=build-placeholder
            CALENDSO_ENCRYPTION_KEY=build-placeholder
            DATABASE_URL=postgresql://placeholder:placeholder@localhost/placeholder
            DATABASE_DIRECT_URL=postgresql://placeholder:placeholder@localhost/placeholder
